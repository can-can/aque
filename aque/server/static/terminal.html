<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>aque terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100%; }
    #term { flex: 1 1 auto; min-height: 0; padding: 4px; }
    #keybar {
      flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto;
      padding: 8px; background: #111; -webkit-overflow-scrolling: touch;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }
    #keybar button {
      flex: 0 0 auto; font: 14px ui-monospace, Menlo, monospace; color: #ddd;
      background: #2a2a2a; border: 1px solid #444; border-radius: 6px; padding: 8px 12px; min-width: 40px;
    }
    #keybar button:active { background: #555; }
  </style>
</head>
<body>
  <div id="app">
    <div id="term"></div>
    <div id="keybar"></div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "1";
    const token = qs.get("token") || "";

    const term = new Terminal({
      fontFamily: "ui-monospace, Menlo, monospace",
      fontSize: 12,
      cursorBlink: true,
      convertEol: false,
      theme: { background: "#000000" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/agents/${id}/terminal?token=${encodeURIComponent(token)}`);
    ws.binaryType = "arraybuffer";
    const enc = new TextEncoder();

    ws.onmessage = (e) => term.write(new Uint8Array(e.data));
    term.onData((d) => { if (ws.readyState === 1) ws.send(enc.encode(d)); });

    function sendSize() {
      if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
    }
    ws.onopen = () => { fit.fit(); sendSize(); };

    let resizeTimer;
    const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { fit.fit(); sendSize(); }, 100); };
    window.addEventListener("resize", onResize);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);

    const KEYS = [
      ["esc", "\x1b"], ["tab", "\t"], ["ctrl-c", "\x03"], ["ctrl-d", "\x04"],
      ["↑", "\x1b[A"], ["↓", "\x1b[B"], ["←", "\x1b[D"], ["→", "\x1b[C"],
      ["/", "/"], ["|", "|"], ["-", "-"],
    ];
    const bar = document.getElementById("keybar");
    for (const [label, seq] of KEYS) {
      const b = document.createElement("button");
      b.textContent = label;
      b.addEventListener("click", (ev) => { ev.preventDefault(); if (ws.readyState === 1) ws.send(enc.encode(seq)); term.focus(); });
      bar.appendChild(b);
    }
  </script>
</body>
</html>
