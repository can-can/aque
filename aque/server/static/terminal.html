<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>aque terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #term { position: fixed; left: 0; right: 0; top: 0; bottom: 0; padding: 2px; }
    #conn {
      position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top));
      transform: translateX(-50%); z-index: 55; pointer-events: none;
      background: rgba(176,122,0,0.92); color: #fff;
      font: 12px -apple-system, system-ui, sans-serif;
      padding: 5px 12px; border-radius: 12px; opacity: 0; transition: opacity 0.15s;
    }
    #conn.show { opacity: 1; }
    #hint {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.72); color: #fff;
      font: 600 38px ui-monospace, Menlo, monospace;
      padding: 10px 20px; border-radius: 14px; opacity: 0;
      transition: opacity 0.1s; pointer-events: none; z-index: 20;
    }
  </style>
</head>
<body>
  <div id="term"></div>
  <div id="conn">reconnecting…</div>
  <div id="hint"></div>
  <script>
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "1";
    const token = qs.get("token") || "";

    // Pure renderer: no stdin, no soft keyboard. All input is native; typing is
    // injected via window.aqueInput, keys go over the separate control socket.
    const term = new Terminal({
      fontFamily: "ui-monospace, Menlo, monospace",
      fontSize: 18,
      cursorBlink: false,
      disableStdin: true,
      convertEol: false,
      theme: { background: "#000000" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();

    // --- output socket with auto-reconnect --------------------------------
    const connEl = document.getElementById("conn");
    function setConn(on) { connEl.classList.toggle("show", on); }
    const wsUrl = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/agents/${id}/terminal?token=${encodeURIComponent(token)}`;
    let ws = null, reconnectTimer = null, reconnectDelay = 500, closingByUser = false;

    function sendSize() {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
    }
    function connect() {
      if (closingByUser) return;
      clearTimeout(reconnectTimer); reconnectTimer = null;
      ws = new WebSocket(wsUrl);
      ws.binaryType = "arraybuffer";
      ws.onmessage = (e) => term.write(new Uint8Array(e.data));
      ws.onopen = () => { reconnectDelay = 500; setConn(false); fit.fit(); sendSize(); };
      ws.onclose = () => { ws = null; scheduleReconnect(); };
      ws.onerror = () => { try { if (ws) ws.close(); } catch (e) {} };
    }
    function scheduleReconnect() {
      if (closingByUser || reconnectTimer) return;
      setConn(true);
      reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 5000);
    }
    function kick() {
      if (closingByUser) return;
      if (!ws || ws.readyState > 1) { reconnectDelay = 500; clearTimeout(reconnectTimer); reconnectTimer = null; connect(); }
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
    window.addEventListener("pageshow", kick);
    window.addEventListener("online", kick);
    connect();

    let resizeT;
    window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => { fit.fit(); sendSize(); }, 120); });

    // ---- zoom: font size → re-fit → resize the pty (debounced) ------------
    const FONT_MIN = 7, FONT_MAX = 28, FONT_DEFAULT = 18;
    let fontSize = FONT_DEFAULT, sizeTimer;
    function pushSize() { clearTimeout(sizeTimer); sizeTimer = setTimeout(sendSize, 90); }
    function setFont(px) {
      px = Math.max(FONT_MIN, Math.min(FONT_MAX, Math.round(px)));
      if (px === fontSize) return false;
      fontSize = px; term.options.fontSize = px; fit.fit(); pushSize();
      return true;
    }

    // ---- shared send + scroll encoding -----------------------------------
    const enc = new TextEncoder();
    function sendKeys(seq) { if (ws && ws.readyState === 1) ws.send(enc.encode(seq)); }
    function wheelSeq(up) {
      const col = Math.max(1, Math.min(term.cols, Math.round(term.cols / 2)));
      const row = Math.max(1, Math.min(term.rows, Math.round(term.rows / 2)));
      return "\x1b[<" + (up ? 64 : 65) + ";" + col + ";" + row + "M";
    }

    const hintEl = document.getElementById("hint");
    let hintTimer;
    function flash(label) {
      hintEl.textContent = label; hintEl.style.opacity = "1";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { hintEl.style.opacity = "0"; }, 420);
    }

    // ---- native bridge hooks (the only JS the app drives) -----------------
    // Typing: dictation / soft-keyboard keystrokes from the app.
    window.aqueInput = (s) => { if (typeof s === "string" && s.length) sendKeys(s); };
    // Scroll: + = older (wheel up), − = newer (wheel down).
    window.aqueScroll = (notches) => {
      notches = notches | 0;
      if (!notches) return;
      const seq = wheelSeq(notches > 0);
      let n = Math.abs(notches), out = "";
      while (n-- > 0) out += seq;
      sendKeys(out);
    };
    // Zoom: +1 in, −1 out.
    window.aqueZoom = (dir) => { if (setFont(fontSize + dir)) flash(fontSize + "px"); };
    // Keyboard height: shrink the terminal above the native soft keyboard.
    const termEl = document.getElementById("term");
    window.aqueSetKeyboardHeight = (px) => {
      if (px > 0) { termEl.style.bottom = "auto"; termEl.style.height = (window.innerHeight - px) + "px"; }
      else { termEl.style.height = ""; termEl.style.bottom = "0"; }
      try { fit.fit(); } catch (e) {}
      pushSize();
    };
  </script>
</body>
</html>
