<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>aque terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="/static/gestures.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    #term { position: fixed; inset: 0; padding: 2px; }
    #hint {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.72); color: #fff;
      font: 600 38px ui-monospace, Menlo, monospace;
      padding: 10px 20px; border-radius: 14px; opacity: 0;
      transition: opacity 0.1s; pointer-events: none; z-index: 20;
    }
    /* Floating "more keys" panel (opened by long-press). */
    #panel { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: none; z-index: 40; }
    #panel.open { display: block; }
    #sheet {
      position: absolute; left: 0; right: 0; bottom: 0; background: #1c1c1e;
      padding: 14px 14px calc(16px + env(safe-area-inset-bottom));
      border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }
    #sheet .title { color: #8e8e93; font: 12px -apple-system, system-ui, sans-serif; text-align: center; margin-bottom: 12px; }
    #sheet .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    #sheet button {
      background: #2c2c2e; color: #fff; border: 1px solid #3a3a3c; border-radius: 10px;
      padding: 15px 6px; font: 16px ui-monospace, Menlo, monospace;
    }
    #sheet button:active { background: #48484a; }
    #sheet button.nav { background: #0a3a66; border-color: #0a4f8c; }
  </style>
</head>
<body>
  <div id="term"></div>
  <div id="hint"></div>
  <div id="panel"><div id="sheet"><div class="title">more keys — tap to send</div><div class="grid" id="panelgrid"></div></div></div>
  <script>
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "1";
    const token = qs.get("token") || "";

    // No soft keyboard: input comes from gestures + the floating panel, not a
    // textarea. disableStdin keeps xterm read-only so the grid stays stable.
    const term = new Terminal({
      fontFamily: "ui-monospace, Menlo, monospace",
      fontSize: 12,
      cursorBlink: false,
      disableStdin: true,
      convertEol: false,
      theme: { background: "#000000" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();

    const ta = document.querySelector(".xterm-helper-textarea");
    if (ta) {
      ta.setAttribute("readonly", "readonly");
      ta.setAttribute("inputmode", "none");
      ta.setAttribute("tabindex", "-1");
      ta.blur();
    }

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/agents/${id}/terminal?token=${encodeURIComponent(token)}`);
    ws.binaryType = "arraybuffer";
    ws.onmessage = (e) => term.write(new Uint8Array(e.data));

    function sendSize() {
      if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
    }
    ws.onopen = () => { fit.fit(); sendSize(); };

    let t;
    window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { fit.fit(); sendSize(); }, 120); });

    // ---- input: shared send + feedback ------------------------------------
    const enc = new TextEncoder();
    function sendKeys(seq) { if (ws.readyState === 1) ws.send(enc.encode(seq)); }
    function navBack() { try { window.webkit.messageHandlers.nav.postMessage("back"); } catch (e) {} }
    function haptic(kind) { try { window.webkit.messageHandlers.haptic.postMessage(kind || "light"); } catch (e) {} }

    const hintEl = document.getElementById("hint");
    let hintTimer;
    function flash(label) {
      hintEl.textContent = label;
      hintEl.style.opacity = "1";
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => { hintEl.style.opacity = "0"; }, 420);
    }

    // ---- floating panel (the "buttons" layer) -----------------------------
    const panelEl = document.getElementById("panel");
    const PANEL = [
      { label: "Esc", seq: "\x1b" },
      { label: "Tab", seq: "\t" },
      { label: "⇧Tab", seq: "\x1b[Z" },
      { label: "Ctrl-C", seq: "\x03" },
      { label: "y", seq: "y" },
      { label: "n", seq: "n" },
      { label: "/", seq: "/" },
      { label: "‹ Back", nav: true },
    ];
    const grid = document.getElementById("panelgrid");
    for (const b of PANEL) {
      const btn = document.createElement("button");
      btn.textContent = b.label;
      if (b.nav) btn.className = "nav";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        haptic("light");
        closePanel();
        if (b.nav) { navBack(); return; }
        sendKeys(b.seq); flash(b.label);
      });
      grid.appendChild(btn);
    }
    function openPanel() { panelEl.classList.add("open"); }
    function closePanel() { panelEl.classList.remove("open"); }
    panelEl.addEventListener("click", closePanel);            // tap backdrop to dismiss
    document.getElementById("sheet").addEventListener("click", (e) => e.stopPropagation());

    // ---- gestures ---------------------------------------------------------
    const GESTURES = {
      tap:           { seq: "\r",     label: "⏎" },
      doubletap:     { seq: "\x1b",   label: "Esc" },
      longpress:     { panel: true },                 // long-press opens the panel
      "swipe-up":    { seq: "\x1b[A", label: "↑" },
      "swipe-down":  { seq: "\x1b[B", label: "↓" },
      "swipe-left":  { seq: "\x1b[D", label: "←" },
      "swipe-right": { seq: "\x1b[C", label: "→" },
    };

    // per-gesture haptic style (real device only; the simulator has no haptics)
    const HAPTIC = {
      tap: "medium", doubletap: "medium", longpress: "heavy",
      "swipe-up": "selection", "swipe-down": "selection",
      "swipe-left": "selection", "swipe-right": "selection",
    };

    // two-finger vertical pan → scroll the terminal's scrollback
    let scrollAccum = 0;
    const ROW_PX = 14; // approx CSS px per row at fontSize 12
    function scrollByPx(dy) {
      scrollAccum += dy;
      const lines = (scrollAccum / ROW_PX) | 0; // truncate toward 0
      if (lines !== 0) { term.scrollLines(-lines); scrollAccum -= lines * ROW_PX; }
    }

    new GestureInput(document.getElementById("term"), {
      map: GESTURES,
      onAction: (a, name) => {
        haptic(HAPTIC[name] || "light");
        if (a.panel) { openPanel(); return; }
        sendKeys(a.seq); flash(a.label);
      },
      onScroll: scrollByPx,
    });
  </script>
</body>
</html>
