<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>aque terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    /* Maximized: the terminal fills the entire WebView, edge to edge. */
    #term { position: fixed; inset: 0; padding: 2px; }
  </style>
</head>
<body>
  <div id="term"></div>
  <script>
    const qs = new URLSearchParams(location.search);
    const id = qs.get("id") || "1";
    const token = qs.get("token") || "";

    // Read-only for now: no input, so the soft keyboard never appears and the
    // terminal grid never changes from a keyboard-driven resize.
    const term = new Terminal({
      fontFamily: "ui-monospace, Menlo, monospace",
      fontSize: 12,
      cursorBlink: false,
      disableStdin: true,
      convertEol: false,
      theme: { background: "#000000" },
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById("term"));
    fit.fit();

    // Belt-and-suspenders: a readonly textarea with inputmode=none will not
    // summon the iOS keyboard even if the terminal gets focused by a tap.
    const ta = document.querySelector(".xterm-helper-textarea");
    if (ta) {
      ta.setAttribute("readonly", "readonly");
      ta.setAttribute("inputmode", "none");
      ta.setAttribute("tabindex", "-1");
      ta.blur();
    }

    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/agents/${id}/terminal?token=${encodeURIComponent(token)}`);
    ws.binaryType = "arraybuffer";
    ws.onmessage = (e) => term.write(new Uint8Array(e.data));

    function sendSize() {
      if (ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
    }
    ws.onopen = () => { fit.fit(); sendSize(); };

    // Only refit on a real geometry change (rotation) — there is no keyboard.
    let t;
    window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { fit.fit(); sendSize(); }, 120); });
  </script>
</body>
</html>
